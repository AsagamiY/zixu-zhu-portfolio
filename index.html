<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191919">
  <meta name="description" content="Selected interactive work by Zixu Zhu — games, playful systems and accessible input.">
  <title>Works — Zixu Zhu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261026">
</head>
<body>
  <canvas class="noise-canvas" aria-hidden="true"></canvas>
  <div class="loading-layer" aria-hidden="true"></div>
  <header class="site-header"><a class="wordmark" href="profile.html" aria-label="Open Zixu Zhu profile"><img class="wordmark-image" src="assets/type-images/wordmark.png" alt="ZIXU ZHU"></a></header>

  <main id="top">
    <section class="works-section" aria-labelledby="page-title">
      <h1 id="page-title"><img src="assets/type-images/works.png" alt="Works"></h1>
      <ul class="works-grid" aria-label="Selected projects">
        <li class="work-card" data-project="zhenren">
          <button class="card-open" type="button" aria-label="View details for HistOracle">
            <span class="artwork artwork-zhenren"><img src="assets/historacle.webp" alt="HistOracle promotional artwork"></span>
            <span class="card-meta"><span class="title-line"><span class="project-title">HistOracle</span><span class="project-kind">Project</span></span><span class="detail-line">Oracle Bone divination</span></span>
          </button>
        </li>
        <li class="work-card" data-project="escape-march">
          <button class="card-open" type="button" aria-label="View details for Escape March">
            <span class="artwork artwork-escape"><img src="assets/escape-march.webp" alt="Escape March promotional artwork with a robot character"></span>
            <span class="card-meta"><span class="title-line"><span class="project-title">Escape March</span><span class="project-kind">BVW</span></span><span class="detail-line">Xbox Adaptive Controller</span></span>
          </button>
        </li>
        <li class="work-card" data-project="big-top-quiz">
          <button class="card-open" type="button" aria-label="View details for BigTopQuiz">
            <span class="artwork"><img src="assets/big-top-quiz.webp" alt="BigTopQuiz promotional artwork featuring a circus tent"></span>
            <span class="card-meta"><span class="title-line"><span class="project-title">BigTopQuiz</span><span class="project-kind">BVW</span></span><span class="detail-line">Quiz · mouse input</span></span>
          </button>
        </li>
        <li class="work-card" data-project="dumpling-samurai">
          <button class="card-open" type="button" aria-label="View details for Dumpling Samurai">
            <span class="artwork"><img src="assets/overstuffed.webp" alt="OverStuffed! promotional artwork for Dumpling Samurai"></span>
            <span class="card-meta"><span class="title-line"><span class="project-title">Dumpling Samurai</span><span class="project-kind">BVW</span></span><span class="detail-line">OverStuffed! build · Jam-o-Drum</span></span>
          </button>
        </li>
      </ul>
    </section>
  </main>

  <dialog class="project-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="Close project details">×</button>
    <span class="dialog-index"></span>
    <h2 id="dialog-title" aria-label="Project details"><img class="dialog-title-image" src="assets/type-images/historacle.png" alt="" aria-hidden="true"></h2>
    <p class="dialog-description"></p>
    <p class="dialog-description dialog-description-zh" lang="zh-CN" hidden></p>
    <div class="project-tagline" hidden>
      <p lang="en"><del class="tagline-en"></del></p>
      <p lang="zh-CN"><del class="tagline-zh"></del></p>
    </div>
    <section class="project-controls" aria-labelledby="controls-title" hidden>
      <h3 id="controls-title">PC CONTROLS / PC 操作</h3>
      <p class="controls-en" lang="en"></p>
      <p class="controls-zh" lang="zh-CN"></p>
    </section>
    <aside class="project-notice" aria-label="Gameplay notice" hidden>
      <p class="notice-en" lang="en"></p>
      <p class="notice-zh" lang="zh-CN"></p>
    </aside>
    <a class="project-link" href="https://projects.etc.cmu.edu/historacle/" target="_blank" rel="noopener noreferrer" hidden>Visit project website ↗</a>
    <a class="project-link project-trailer-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Watch gameplay video / 观看实机演示 ↗</a>
    <a class="project-link project-download-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Download Windows build / 下载 Windows 版 ↗</a>
  </dialog>
  <script src="script.js?v=20261026"></script>
</body>
</html>
